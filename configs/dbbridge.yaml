# Single-node development configuration. Every value here is a default that a
# production deployment is expected to change; see deploy/k8s for one that does.
instance:
  id: dbbridge-local
  metastore: memory   # "redis" or "memory"
  redis_addr: "redis:6379"
  redis_password: ""
  redis_db: 0
  default_storage: fs
  heartbeat_ttl: 5s

server:
  rest_addr: ":8080"
  grpc_addr: ":9090"
  # Set admin_addr to move /metrics and /v1/admin/* to their own listener.
  # admin_addr: ":8081"
  max_request_bytes: 1048576
  request_timeout: 60s
  read_header_timeout: 10s
  idle_timeout: 120s
  # Number of reverse proxies in front of the service. 0 means there is none,
  # so X-Forwarded-For is not trusted at all.
  trusted_proxy_count: 0
  # Browser origins allowed to open a WebSocket. Empty means same-origin only.
  ws_allowed_origins: []
  tls:
    # cert_file: /etc/dbbridge/tls/tls.crt
    # key_file: /etc/dbbridge/tls/tls.key
    # Serve gRPC as cleartext HTTP/2 while no certificate is configured.
    allow_h2c: true

# Without an auth section the API accepts unauthenticated requests, which is
# only appropriate on a workstation. Uncomment to require bearer tokens:
#
# auth:
#   tokens:
#     - subject: reporting
#       value_env: DBBRIDGE_TOKEN_REPORTING
#       scopes: [read, write]
#     - subject: orchestrator
#       value_env: DBBRIDGE_TOKEN_ADMIN
#       scopes: [admin]

defaults:
  result_ttl: 24h
  query_timeout: 0s
  # 0 means unlimited. Fixed at startup, a reload reports it as ignored.
  max_concurrent_queries: 0
  # DML and DDL are rejected unless this is turned on explicitly.
  allow_writes: false

storage:
  fs:
    root: "./results"
  s3:
    bucket: ""
    region: "us-east-1"
    endpoint: ""
    access_key_id: ""
    secret_access_key: ""
  clickhouse:
    dsn: ""
    table: "dbbridge_results"

databases:
  - id: pg_test
    engine: postgres
    dsn: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
    display_name: "PostgreSQL Production Main"
    max_conns: 10

  - id: mysql_test
    engine: mysql
    dsn: "root:root@tcp(localhost:3306)/mysql"
    display_name: "MySQL Replica"
    max_conns: 5
