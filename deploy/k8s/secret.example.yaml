# Credentials are referenced from the ConfigMap as ${VAR} and injected as
# environment variables, so they never sit in the ConfigMap itself.
#
# This is an example, not a manifest to apply. Copy it to secret.yaml, put real
# values in every field and apply that copy. The .example suffix keeps it out of
# `kubectl apply -f deploy/k8s/`: applied as is, the two identical placeholder
# tokens are rejected by startup validation and the pod ends up in
# CrashLoopBackOff with an error that does not name this file.
apiVersion: v1
kind: Secret
metadata:
  name: dbbridge-secrets
  namespace: default
type: Opaque
stringData:
  REDIS_PASSWORD: "replace-me"
  S3_ACCESS_KEY_ID: "replace-me"
  S3_SECRET_ACCESS_KEY: "replace-me"
  # Every token has to be distinct: two tokens with the same value are refused
  # at startup, and a shared value would make the subjects indistinguishable.
  DBBRIDGE_TOKEN_REPORTING: "replace-me-reporting"
  DBBRIDGE_TOKEN_ADMIN: "replace-me-admin"
